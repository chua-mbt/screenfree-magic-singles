<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Free MTG Search</title>
  <style>
    body { font-family: sans-serif; max-width: 1400px; margin: 20px auto; padding: 0 20px; }
    .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 8px; }
    .input-col { display: flex; flex-direction: column; }
    .missing-col { height: 300px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; padding: 12px; background: #fff5f5; box-sizing: border-box; }
    .missing-col h3 { margin: 0 0 8px 0; color: #c00; font-size: 14px; }
    .missing-col p { margin: 2px 0; font-size: 13px; }
    textarea { width: 100%; height: 300px; font-family: monospace; resize: none; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card-cell { border: 1px solid #eee; border-radius: 8px; padding: 12px; text-align: center; }
    .card-cell img { width: 100%; max-width: 200px; height: auto; pointer-events: none; }
    .card-info { font-size: 14px; margin: 8px 0; pointer-events: none; }
    .card-price { font-weight: bold; color: #2a7d2a; pointer-events: none; }
    .card-count { font-size: 12px; color: #666; margin-top: 4px; pointer-events: none; }
    .card-cell { cursor: pointer; transition: border-color 0.15s; }
    .card-cell:hover { border-color: #999; }
    .card-cell.selected { border-color: #2a7d2a; border-width: 2px; background: #f0fff0; }
    .banner { position: sticky; top: 0; background: #2a7d2a; color: white; padding: 10px 16px; display: flex; align-items: center; gap: 12px; z-index: 100; border-radius: 8px; margin-bottom: 12px; }
    .banner span { flex: 1; }
    .banner button { background: white; color: #2a7d2a; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #status { margin: 10px 0; color: #555; }
    .errors { color: #c00; font-size: 13px; }
    .errors p { margin: 2px 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
